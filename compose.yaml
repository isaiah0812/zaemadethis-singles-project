include:
  - ./api/compose.yaml
services:
  client:
    container_name: client
    build:
      context: client
      dockerfile: dev.Dockerfile
    ports:
      - 3000:3000
    depends_on:
      - gcs
      - api
    develop:
      watch:
        - action: sync
          path: ./client
          target: ./client
          initial_sync: true
